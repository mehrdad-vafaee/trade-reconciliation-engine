<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <style>
    .t { font-size: 18px; font-weight: bold; fill: #222; }
    .s { font-size: 13px; fill: #444; }
    .m { font-size: 13px; fill: #222; font-family: Menlo, monospace; }
    .l { font-size: 12px; fill: #333; font-style: italic; }
    .arrow { stroke: #444; stroke-width: 2; fill: none; marker-end: url(#a); }
  </style>

  <rect width="1280" height="760" fill="#fff"/>
  <text x="640" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#111">Trade Reconciliation Engine — architecture</text>

  <!-- Docker Compose -->
  <rect x="30" y="70" width="880" height="660" rx="14" fill="#f7f9fc" stroke="#7a8aa0" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="50" y="96" class="s" font-weight="bold">docker compose (local)</text>

  <!-- Airflow -->
  <rect x="60" y="110" width="380" height="310" rx="10" fill="#e6f4f1" stroke="#017cee" stroke-width="2"/>
  <text x="80" y="140" class="t">Airflow 3.3 (standalone)</text>
  <text x="80" y="160" class="s">UI :8081 · DAG trade_reconciliation · manual trigger</text>
  <g>
    <rect x="90" y="180" width="320" height="44" rx="6" fill="#fff" stroke="#017cee"/>
    <text x="250" y="207" text-anchor="middle" class="m">generate_feeds  (spark-submit)</text>
    <rect x="90" y="250" width="320" height="44" rx="6" fill="#fff" stroke="#017cee"/>
    <text x="250" y="277" text-anchor="middle" class="m">reconcile  (spark-submit)</text>
    <rect x="90" y="320" width="320" height="44" rx="6" fill="#fff" stroke="#017cee"/>
    <text x="250" y="347" text-anchor="middle" class="m">load_bigquery  (python)</text>
    <path d="M250,224 V248" class="arrow"/>
    <path d="M250,294 V318" class="arrow"/>
  </g>
  <text x="80" y="395" class="s">Spark driver in client mode (JDK 17 + pyspark 4.0.4)</text>
  <text x="80" y="411" class="s">GCP service account key from ./secrets (read-only)</text>

  <!-- Spark -->
  <rect x="490" y="110" width="390" height="310" rx="10" fill="#fdf0e6" stroke="#e25a1c" stroke-width="2"/>
  <text x="510" y="140" class="t">Spark 4.0.4 standalone</text>
  <rect x="520" y="160" width="330" height="60" rx="6" fill="#fff" stroke="#e25a1c"/>
  <text x="685" y="186" text-anchor="middle" class="m">spark-master</text>
  <text x="685" y="206" text-anchor="middle" class="s">:7077 · UI :8080</text>
  <rect x="520" y="290" width="155" height="80" rx="6" fill="#fff" stroke="#e25a1c"/>
  <text x="597" y="322" text-anchor="middle" class="m">spark-worker 1</text>
  <text x="597" y="344" text-anchor="middle" class="s">2 core · 2 GB</text>
  <rect x="695" y="290" width="155" height="80" rx="6" fill="#fff" stroke="#e25a1c"/>
  <text x="772" y="322" text-anchor="middle" class="m">spark-worker 2</text>
  <text x="772" y="344" text-anchor="middle" class="s">2 core · 2 GB</text>
  <path d="M600,220 V288" class="arrow"/>
  <path d="M772,220 V288" class="arrow"/>
  <text x="685" y="258" text-anchor="middle" class="l">executor</text>

  <!-- Airflow -> Spark -->
  <path d="M410,230 C455,230 470,190 518,190" class="arrow"/>
  <text x="463" y="174" text-anchor="middle" class="l">submit</text>

  <!-- Volume dati -->
  <rect x="60" y="460" width="820" height="250" rx="10" fill="#f1f1f1" stroke="#888" stroke-width="2"/>
  <text x="80" y="490" class="t">Shared volume  ./data → /opt/data</text>
  <text x="80" y="510" class="s">mounted by Airflow, master and workers (along with ./jobs → /opt/jobs)</text>

  <rect x="90" y="530" width="220" height="150" rx="6" fill="#fff" stroke="#888"/>
  <text x="105" y="556" class="m" font-weight="bold">source/</text>
  <text x="105" y="580" class="s">transactions_data-</text>
  <text x="105" y="597" class="s">selected-columns.csv</text>
  <text x="105" y="624" class="s">source dataset</text>

  <rect x="350" y="530" width="240" height="150" rx="6" fill="#fff" stroke="#888"/>
  <text x="365" y="556" class="m" font-weight="bold">raw/</text>
  <text x="365" y="580" class="s">feed_a/  clean CSV (broker A)</text>
  <text x="365" y="600" class="s">feed_b/  CSV with errors (broker B)</text>
  <text x="365" y="620" class="s">expected_counts.json</text>

  <rect x="630" y="530" width="225" height="150" rx="6" fill="#fff" stroke="#888"/>
  <text x="645" y="556" class="m" font-weight="bold">output/</text>
  <text x="645" y="580" class="s">reconciled/  Parquet</text>
  <text x="645" y="600" class="s">quarantine/  Parquet</text>
  <text x="645" y="620" class="s">(one file each)</text>

  <path d="M310,605 H348" class="arrow"/>
  <text x="329" y="592" text-anchor="middle" class="l">generate</text>
  <path d="M590,605 H628" class="arrow"/>
  <text x="609" y="592" text-anchor="middle" class="l">reconcile</text>

  <!-- Spark <-> dati -->
  <path d="M685,372 V458" class="arrow" marker-start="url(#a)"/>
  <text x="695" y="445" class="l">read / write</text>

  <!-- BigQuery -->
  <rect x="950" y="300" width="300" height="410" rx="10" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="970" y="330" class="t">Google BigQuery</text>
  <text x="970" y="350" class="s">dataset trade_reconciliation_dev (EU)</text>

  <rect x="975" y="375" width="250" height="140" rx="6" fill="#fff" stroke="#4285f4"/>
  <text x="990" y="400" class="m" font-weight="bold">reconciled</text>
  <text x="990" y="424" class="s">rows matched A↔B by id</text>
  <text x="990" y="446" class="s">status: MATCHED / *_BREAK</text>
  <text x="990" y="468" class="s">partition: month of date_a</text>
  <text x="990" y="490" class="s">cluster: status</text>

  <rect x="975" y="540" width="250" height="140" rx="6" fill="#fff" stroke="#4285f4"/>
  <text x="990" y="565" class="m" font-weight="bold">quarantine</text>
  <text x="990" y="589" class="s">orphans, duplicates, invalid</text>
  <text x="990" y="611" class="s">raw values as STRING</text>
  <text x="990" y="633" class="s">reason + reason_column</text>
  <text x="990" y="655" class="s">cluster: reason</text>

  <!-- output -> BigQuery -->
  <path d="M855,605 C900,605 900,445 973,445" class="arrow"/>
  <path d="M855,605 H973" class="arrow"/>
  <text x="1100" y="735" text-anchor="middle" class="l">load_bigquery: Parquet, WRITE_TRUNCATE</text>
</svg>
