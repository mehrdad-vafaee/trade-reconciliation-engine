<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="460" viewBox="0 0 1440 460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <style>
    .t { font-size: 17px; font-weight: bold; fill: #111; }
    .s { font-size: 14px; fill: #444; }
    .g { font-size: 14px; fill: #555; font-style: italic; }
    .box { fill: #fff; stroke: #333; stroke-width: 1.5; }
    .flow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#a); }
    .ctrl { stroke: #777; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; marker-end: url(#a); }
  </style>

  <rect width="1440" height="460" fill="#fff"/>

  <rect x="20" y="20" width="860" height="420" rx="12" fill="#fafafa" stroke="#888" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="40" y="425" class="g">Local environment (Docker Compose) · intermediate data on a shared volume (CSV, Parquet)</text>

  <rect x="45" y="45" width="800" height="60" rx="8" fill="#eef4fb" stroke="#333" stroke-width="1.5"/>
  <text x="445" y="72" text-anchor="middle" class="t">Apache Airflow</text>
  <text x="445" y="92" text-anchor="middle" class="s">pipeline orchestration</text>

  <rect x="215" y="170" width="400" height="200" rx="10" fill="#fdf3ec" stroke="#333" stroke-width="1.5"/>
  <text x="415" y="355" text-anchor="middle" class="g">Spark cluster (master + 2 workers)</text>

  <rect x="45" y="210" width="140" height="90" rx="6" class="box"/>
  <text x="115" y="245" text-anchor="middle" class="t">Dataset</text>
  <text x="115" y="267" text-anchor="middle" class="s">transactions</text>
  <text x="115" y="285" text-anchor="middle" class="s">(CSV)</text>

  <rect x="230" y="210" width="165" height="90" rx="6" class="box"/>
  <text x="312" y="240" text-anchor="middle" class="t">Feed generation</text>
  <text x="312" y="264" text-anchor="middle" class="s">broker A: clean</text>
  <text x="312" y="282" text-anchor="middle" class="s">broker B: with errors</text>

  <rect x="435" y="210" width="165" height="90" rx="6" class="box"/>
  <text x="517" y="240" text-anchor="middle" class="t">Reconciliation</text>
  <text x="517" y="264" text-anchor="middle" class="s">A↔B join on id</text>
  <text x="517" y="282" text-anchor="middle" class="s">break classification</text>

  <rect x="655" y="210" width="190" height="90" rx="6" class="box"/>
  <text x="750" y="240" text-anchor="middle" class="t">Loading</text>
  <text x="750" y="264" text-anchor="middle" class="s">Parquet results</text>
  <text x="750" y="282" text-anchor="middle" class="s">to BigQuery</text>

  <path d="M185,255 H228" class="flow"/>
  <path d="M395,255 H433" class="flow"/>
  <path d="M600,255 H653" class="flow"/>
  <path d="M845,255 H918" class="flow"/>

  <path d="M312,105 V208" class="ctrl"/>
  <path d="M517,105 V208" class="ctrl"/>
  <path d="M750,105 V208" class="ctrl"/>

  <rect x="920" y="140" width="260" height="230" rx="10" fill="#eef4fb" stroke="#333" stroke-width="1.5"/>
  <text x="1050" y="170" text-anchor="middle" class="t">Google BigQuery</text>
  <text x="1050" y="190" text-anchor="middle" class="g">cloud</text>
  <rect x="940" y="205" width="220" height="70" rx="6" class="box"/>
  <text x="1050" y="233" text-anchor="middle" class="t">reconciled</text>
  <text x="1050" y="255" text-anchor="middle" class="s">matched rows: match / break</text>
  <rect x="940" y="285" width="220" height="70" rx="6" class="box"/>
  <text x="1050" y="313" text-anchor="middle" class="t">quarantine</text>
  <text x="1050" y="335" text-anchor="middle" class="s">orphans, duplicates, invalid</text>

  <path d="M1180,255 H1228" class="flow"/>
  <rect x="1230" y="185" width="190" height="140" rx="10" fill="#eef4fb" stroke="#333" stroke-width="1.5"/>
  <text x="1325" y="230" text-anchor="middle" class="t">Looker Studio</text>
  <text x="1325" y="250" text-anchor="middle" class="g">dashboard</text>
  <text x="1325" y="280" text-anchor="middle" class="s">break and quarantine</text>
  <text x="1325" y="298" text-anchor="middle" class="s">analysis</text>
  <path d="M920,410 H960" class="flow"/>
  <text x="968" y="415" class="s">data flow</text>
  <path d="M1060,410 H1100" class="ctrl"/>
  <text x="1108" y="415" class="s">control</text>
</svg>
